# dconf: /org/gnome/settings-daemon/plugins/media-keys/
[/]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/print-area/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/print-full/']
home=['<Super>e']

[custom-keybindings/print-area]
binding='<Super>s'
command='@HOME@/.local/bin/print-clipboard area'
name='Captura de área para a área de transferência'

[custom-keybindings/print-full]
binding='<Shift><Super>s'
command='@HOME@/.local/bin/print-clipboard tela'
name='Captura da tela inteira para a área de transferência'
